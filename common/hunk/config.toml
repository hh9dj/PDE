theme = "catppuccin-latte"
mode = "auto"
vcs = "git"
watch = false
exclude_untracked = true
line_numbers = true
wrap_lines = true
menu_bar = true
agent_notes = true
transparent_background = false

[keybindings]
"hunk.review.previousFile" = "("
"hunk.review.nextFile" = ")"
"hunk.review.scrollCodeLeft" = ["h", "H"]
"hunk.review.scrollCodeRight" = ["l", "L"]
"hunk.view.toggleLineNumbers" = "alt+l"
