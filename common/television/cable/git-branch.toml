[metadata]
name = "git-branch"
description = "A channel to select from git branches"
requirements = ["git"]

# Ctrl+s cycles the sources: local branches first (wt switch, git push), then all (with remotes).
[source]
command = [
  { name = "Local", run = "git --no-pager branch --format=\"%(refname:short)\"" },
  { name = "All",   run = "git --no-pager branch --all --format=\"%(refname:short)\"" },
]
output = "{split: :0}"

[preview]
command = "git show -p --stat --pretty=fuller --color=always '{0}'"

# Enter returns the branch name (Ctrl+f autocomplete). Checkout and merge: action picker (Ctrl+x).
# No ctrl-m: terminals send it as Enter.
[keybindings]
ctrl-d = "actions:delete"
ctrl-r = "actions:rebase"

[actions.checkout]
description = "Checkout the selected branch"
command = "git checkout '{0}'"
mode = "execute"

[actions.delete]
description = "Delete the selected branch"
command = "git branch -d '{0}'"
mode = "execute"

[actions.merge]
description = "Merge the selected branch into current branch"
command = "git merge '{0}'"
mode = "execute"

[actions.rebase]
description = "Rebase current branch onto the selected branch"
command = "git rebase '{0}'"
mode = "execute"
