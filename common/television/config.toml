# television config, shared by Nix (common/television/default.nix reads it with fromTOML)
# and Windows (windows/television/setup.ps1 copies it).
# Nix adds the Linux/macOS-only triggers (alias, env, spiders, docker-images, git-repos).
tick_rate = 50
default_channel = "files"
history_size = 200
global_history = false

[ui]
ui_scale = 100
orientation = "landscape"
theme = "default"

[ui.input_bar]
position = "top"
prompt = ">"
border_type = "rounded"

[ui.status_bar]
separator_open = ""
separator_close = ""
hidden = false

[ui.results_panel]
border_type = "rounded"

[ui.preview_panel]
size = 50
scrollbar = true
border_type = "rounded"
hidden = false

[ui.help_panel]
show_categories = true
hidden = true

[ui.remote_control]
show_channel_descriptions = true
sort_alphabetically = true

[keybindings]
esc = "quit"
ctrl-c = "quit"
down = "select_next_entry"
ctrl-n = "select_next_entry"
ctrl-j = "select_next_entry"
up = "select_prev_entry"
ctrl-p = "select_prev_entry"
ctrl-k = "select_prev_entry"
ctrl-up = "select_prev_history"
ctrl-down = "select_next_history"
tab = "toggle_selection_down"
backtab = "toggle_selection_up"
enter = "confirm_selection"
pagedown = "scroll_preview_half_page_down"
pageup = "scroll_preview_half_page_up"
ctrl-f = "cycle_previews"
ctrl-y = "copy_entry_to_clipboard"
ctrl-r = "reload_source"
ctrl-s = "cycle_sources"
ctrl-t = "toggle_remote_control"
ctrl-x = "toggle_action_picker"
ctrl-o = "toggle_preview"
ctrl-h = "toggle_help"
f12 = "toggle_status_bar"
ctrl-l = "toggle_layout"
backspace = "delete_prev_char"
ctrl-w = "delete_prev_word"
ctrl-u = "delete_line"
delete = "delete_next_char"
left = "go_to_prev_char"
right = "go_to_next_char"
home = "go_to_input_start"
ctrl-a = "go_to_input_start"
end = "go_to_input_end"
ctrl-e = "go_to_input_end"

# Shell integration: Ctrl+f = smart autocomplete, channel chosen from the command before the cursor.
# A trigger matches when its words appear in order in the line. The first match wins,
# so a command must not be listed under two channels.
# Windows: Ctrl+r stays on fzf (windows/fzf/fzf.ps1), see the profile.
[shell_integration]
fallback_channel = "files"

[shell_integration.channel_triggers]
dirs = ["cd", "ls", "rmdir", "z", "ll", "la", "lt", "Set-Location"]
files = [
  "cat", "less", "head", "tail", "vim", "nano", "bat", "cp", "mv", "rm", "touch", "chmod", "chown", "ln",
  "tar", "zip", "unzip", "gzip", "gunzip", "xz",
  "type", "e", "nvim", "Get-Content", "Copy-Item", "Move-Item", "Remove-Item",
]
git-diff = ["git add", "git restore"]
# Commands that take only a branch name.
git-branch = [
  "git branch", "git pull", "git push", "git switch", "gsw",
  "wt switch", "wt remove", "wt merge",
]
# Commands that take a branch or a commit.
git-refs = ["git checkout", "git merge", "git rebase", "git reset", "git cherry-pick", "git revert", "git diff"]
git-log = ["git log", "git show"]
channels = ["tv"]

[shell_integration.keybindings]
smart_autocomplete = "ctrl-f"
command_history = "ctrl-r"
