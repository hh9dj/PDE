session_name: NucliPlan
suppress_history: true
start_directory: ~/projects/nucliplan/
before_script: ~/.config/tmux/scripts/direnv_prewarm
repo: hh9dj/nucliplan.git
windows:
  - window_name: "src"
    shell_command_before: nvim
    focus: true
  - window_name: "shell"
  - window_name: "coding-agent"
    shell_command_before: opencode
