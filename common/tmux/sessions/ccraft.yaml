session_name: ccraft
suppress_history: true
start_directory: ~/projects/ccraft
before_script: ~/.config/tmux/scripts/direnv_prewarm
repo: hh9dj/ccraft.git
windows:
  - window_name: "src"
    shell_command_before: nvim
    focus: true
  - window_name: "shell"
  - window_name: "AI"
    shell_command_before: opencode
  - window_name: "docs"
    shell_command_before: just docs
