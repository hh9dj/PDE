session_name: Exercism
suppress_history: true
start_directory: ~/projects/exercism/
before_script: ~/.config/tmux/scripts/direnv_prewarm
repo: hh9dj/exercism.git
windows:
  - window_name: "src"
    shell_command_before: nvim
    focus: true
  - window_name: "shell"
  - window_name: "AI"
    shell_command_before: opencode
