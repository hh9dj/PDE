session_name: Homelab
suppress_history: true
start_directory: ~/projects/homelab/
before_script: ~/.config/tmux/scripts/direnv_prewarm
repo: hh9dj/homelab.git
windows:
  - window_name: "src"
    shell_command_before: nvim
    focus: true
  - window_name: "ssh"
    shell_command_before: ssh homelab
  - window_name: "shell"
  - window_name: "coding-agent"
    shell_command_before: opencode
