session_name: Discovery
suppress_history: true
start_directory: ~/projects/discovery/
repo: hh9dj/discovery.git
windows:
  - window_name: "src"
    shell_command_before:
      - cmd: nvim
        sleep_before: 1
    focus: true
  - window_name: "shell"
  - window_name: "coding-agent"
    shell_command_before:
      - cmd: opencode
        sleep_before: 1
  - window_name: "claude"
    shell_command_before:
      - cmd: claude
        sleep_before: 1
