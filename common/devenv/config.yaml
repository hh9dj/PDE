# yaml-language-server: $schema=https://devenv.sh/devenv.user.schema.json
version: 1
tui:
  viewport: inline
  theme:
    preset: none
  statusline:
    enabled: false
  behavior:
    mouse: false
    follow_logs: true
    hide_stopped_processes: false
    log_preview_lines: 5
    log_history_lines: 5000
shell:
  prompt_prefix: false
  keybindings:
    toggle_pause: []
    list_watched_files: []
    toggle_error: []
    reload: []
