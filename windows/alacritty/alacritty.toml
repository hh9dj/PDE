[env]
TERM = "xterm-256color"

[window]
startup_mode = "Maximized"

[window.padding]
x = 180
y = 90

[scrolling]
history = 10000

[font]
size = 16.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[terminal.shell]
program = "pwsh"
args = ["-NoLogo"]

[colors.primary]
background = "#eff1f5"
foreground = "#4c4f69"

# Official Catppuccin Latte ANSI palette. On a light theme, "black" must be
# dark: PSReadLine and many CLIs print secondary text in (bright) black.
[colors.normal]
black = "#5c5f77"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#acb0be"

[colors.bright]
black = "#6c6f85"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#bcc0cc"

[keyboard]
bindings = [
  { key = "Enter", mods = "Alt", chars = "\u001b[13;3u" },
  { key = "Enter", mods = "Shift", chars = "\u001b[13;2u" },
]
