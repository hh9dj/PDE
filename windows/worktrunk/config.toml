# worktrunk user config (Windows). Installed by setup_worktrunk to %APPDATA%\worktrunk\config.toml.
# User hooks need no approval and apply to every repository. They run with bash from Git for Windows.
# Default worktree path: ../<repo>.<branch> (siblings of the repository).
# Relative uv path dependencies such as ../mylib keep working from a worktree.

# wt step copy-ignored: copy only small gitignored files (.env, local config).
# NTFS has no reflinks, so every file is a full copy. Dependencies are installed instead (post-start).
# .venv cannot be copied: it contains absolute paths.
[step.copy-ignored]
exclude = [
    "node_modules/",
    ".venv/",
    "dist/",
    "__pycache__/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".mypy_cache/",
]

# Blocking: the small files exist before gemini and nvim start.
[pre-start]
copy = "wt step copy-ignored"

# Background: install the dependencies from the local caches. Logs: wt config state logs.
# uv hard-links from its cache on Windows (cache and worktrees must be on the same drive).
# npm copies from its cache. pnpm hard-links from its store.
[post-start]
deps = """
if [ -f uv.lock ]; then uv sync --frozen; fi
if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
elif [ -f package-lock.json ]; then npm ci --prefer-offline --no-audit --no-fund; fi
"""
