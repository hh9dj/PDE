# worktrunk user config (Windows). Installed by setup_worktrunk to %APPDATA%\worktrunk\config.toml.
# User hooks need no approval and apply to every repository. They run with bash from Git for Windows.
# Default worktree path: ../<repo>.<branch> (siblings of the repository).
# Relative uv path dependencies such as ../mylib keep working from a worktree.

# wt step copy-ignored: copy gitignored files (.env, local config, node_modules, .venv).
# NTFS has no reflinks, so every file is a full copy. This is slow for large trees.
# A copied .venv contains absolute paths. post-start runs uv sync to repair it.
[step.copy-ignored]
exclude = [
    "dist/",
    "__pycache__/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".mypy_cache/",
]

# Blocking: the copied files exist before gemini and nvim start.
[pre-start]
copy = "wt step copy-ignored"

# Background: sync the copied dependencies with the lockfiles. Logs: wt config state logs.
# npm install (not npm ci) reuses the copied node_modules. npm ci would delete it first.
[post-start]
deps = """
if [ -f uv.lock ]; then uv sync --frozen; fi
if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
elif [ -f package-lock.json ]; then npm install --prefer-offline --no-audit --no-fund; fi
"""

# Background, after every wt switch: name the current zellij tab after the branch.
# Does nothing outside zellij. zellij-attention adds its status icon to the new name.
[post-switch]
zellij-tab = """
if [ -n "$ZELLIJ" ]; then zellij action rename-tab "{{ branch }}"; fi
"""
