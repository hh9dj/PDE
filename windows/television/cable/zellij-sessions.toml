[metadata]
name = "zellij-sessions"
description = "List live zellij sessions (Enter switches inside zellij, attaches outside)"
requirements = ["zellij"]

[source]
command = "zellij list-sessions --short --no-formatting"

[keybindings]
enter = "actions:switch"

# tv on Windows runs actions with Windows PowerShell, quotes {} and runs "execute" as "fork".
[actions.switch]
description = "Switch to the selected session (attach when outside zellij)"
command = "if ($env:ZELLIJ) { zellij action switch-session {} } else { zellij attach {} }"
shell = "powershell"
mode = "fork"

[actions.kill]
description = "Kill the selected session"
command = "zellij kill-session {}"
mode = "fork"
