[metadata]
name = "zellij-sessions"
description = "List live zellij sessions (Enter prints the name, the za function attaches or switches)"
requirements = ["zellij"]

[source]
command = "zellij list-sessions --short --no-formatting"

[actions.kill]
description = "Kill the selected session"
command = "zellij kill-session {}"
mode = "fork"
